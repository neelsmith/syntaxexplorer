<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #666666;
    --border: #cccccc;
    --accent: #f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #1a1a1a;
      --muted: #a0a0a0;
      --border: #444444;
      --accent: #262626;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 1.5rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0 0 0.35rem 0; color: var(--muted); font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0; }
  #app-footer {
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    margin-top: 2.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }
  .file-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin: 1rem 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #status {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  #status[data-state="error"] { color: #c0392b; }
  #explorer {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 2fr;
    gap: 1.5rem;
    margin-top: 1rem;
  }
  @media (max-width: 640px) {
    #explorer { grid-template-columns: 1fr; }
  }
  label {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  #sentence-menu {
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
  }
  #sentence-menu option { padding: 0.25rem 0.4rem; }
  #sentence-view {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.25rem;
    min-height: 4rem;
    font-size: 1.3rem;
    line-height: 1.6;
    background: var(--accent);
  }
  #sentence-view:empty::before {
    content: "Select a sentence from the menu to see its text here.";
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .graph-section {
    /* Spans both #explorer columns, so it lands in its own full-width
       row below the sentence menu/text row instead of sharing a column
       with either of them — full width here meaning the full content
       column (same width as the header/menu above), not a break past
       the page's own max-width. */
    grid-column: 1 / -1;
    margin-top: 0.5rem;
  }
  .graph-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .graph-controls label {
    margin-bottom: 0;
    white-space: nowrap;
  }
  #graph-orientation {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    padding: 0.2rem 0.4rem;
  }
  .graph-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 0.5rem 0;
  }
  #graph-view {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--accent);
    height: 65vh;
    min-height: 360px;
  }
  #graph-view:empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: auto;
    min-height: 4rem;
    padding: 1rem;
  }
  #graph-view:empty::before {
    content: "Select a sentence to see its dependency graph here.";
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
  }
  /* The graph is rendered at its natural (possibly large) size and made
     navigable by svg-pan-zoom, rather than shrunk to fit — see
     notes/sentence-explorer-app.md. overflow: hidden because
     svg-pan-zoom manages panning itself via an SVG transform; native
     scrollbars would just fight it. */
  #graph-view svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
  }
</style>
</head>
<body>
  <h1>Syntax Explorer</h1>
  <p class="subtitle">Browse the sentences of a saved syntactic analysis.</p>

  <div class="file-row">
    <input type="file" id="file-input" accept=".txt,.cex,text/plain">
  </div>
  <div id="status" role="status"></div>

  <div id="explorer" hidden>
    <div>
      <label for="sentence-menu">Sentences</label>
      <select id="sentence-menu" size="18"></select>
    </div>
    <div>
      <h2>Sentence text</h2>
      <div id="sentence-view"></div>
    </div>

    <div class="graph-section">
      <div class="graph-controls">
        <h2 style="margin:0;">Dependency graph</h2>
        <label for="graph-orientation">Orientation</label>
        <select id="graph-orientation">
          <option value="BT" selected>Bottom-to-top (BT)</option>
          <option value="TB">Top-to-bottom (TB)</option>
          <option value="LR">Left-to-right (LR)</option>
          <option value="RL">Right-to-left (RL)</option>
        </select>
      </div>
      <p class="graph-hint">Scroll or pinch to zoom, drag to pan, or use the +/&minus;/reset buttons in the corner.</p>
      <div id="graph-view"></div>
    </div>
  </div>

  <footer id="app-footer"></footer>

  <!--
    Plain, non-module scripts on purpose: this lets the page be opened
    directly from disk (a file:// URL) with no web server, and lets
    js/lib/*.js be dropped into other apps unchanged. See
    notes/library-api.md and notes/sentence-explorer-app.md.

    js/vendor/mermaid/ and js/vendor/svg-pan-zoom/ are vendored copies
    of Mermaid's and svg-pan-zoom's UMD builds (see the LICENSE file in
    each) so the graph renders and can be panned/zoomed with no network
    access and no build step, the same as the rest of the app.
  -->
  <script src="../../js/version.js"></script>
  <script src="../../js/lib/cts-urn.js"></script>
  <script src="../../js/lib/syntaxer.js"></script>
  <script src="../../js/vendor/mermaid/mermaid.min.js"></script>
  <script src="../../js/vendor/svg-pan-zoom/svg-pan-zoom.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
