<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #666666;
    --border: #cccccc;
    --accent: #f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #1a1a1a;
      --muted: #a0a0a0;
      --border: #444444;
      --accent: #262626;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 1.5rem;
    max-width: 900px;
    margin-inline: auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0; }
  .file-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin: 1rem 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #status {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  #status[data-state="error"] { color: #c0392b; }
  #explorer {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 2fr;
    gap: 1.5rem;
    margin-top: 1rem;
  }
  @media (max-width: 640px) {
    #explorer { grid-template-columns: 1fr; }
  }
  label {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  #sentence-menu {
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
  }
  #sentence-menu option { padding: 0.25rem 0.4rem; }
  #sentence-view {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.25rem;
    min-height: 4rem;
    font-size: 1.3rem;
    line-height: 1.6;
    background: var(--accent);
  }
  #sentence-view:empty::before {
    content: "Select a sentence from the menu to see its text here.";
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>Syntax Explorer</h1>
  <p class="subtitle">Browse the sentences of a syntactic analysis saved by <code>arsgrammatica</code>.</p>

  <div class="file-row">
    <input type="file" id="file-input" accept=".txt,.cex,text/plain">
  </div>
  <div id="status" role="status"></div>

  <div id="explorer" hidden>
    <div>
      <label for="sentence-menu">Sentences</label>
      <select id="sentence-menu" size="18"></select>
    </div>
    <div>
      <label for="sentence-view">Sentence text</label>
      <div id="sentence-view"></div>
    </div>
  </div>

  <!--
    Plain, non-module scripts on purpose: this lets the page be opened
    directly from disk (a file:// URL) with no web server, and lets
    js/lib/*.js be dropped into other apps unchanged. See
    notes/library-api.md and notes/sentence-explorer-app.md.
  -->
  <script src="../../js/lib/cts-urn.js"></script>
  <script src="../../js/lib/arsgrammatica.js"></script>
  <script src="app.js"></script>
</body>
</html>
